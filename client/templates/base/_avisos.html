{% comment %}Mensajes de django.contrib.messages con los mismos avisos de equipos. Requiere catalogos.css.{% endcomment %}
{% for m in messages %}
<div class="aviso aviso--{% if m.tags == 'error' %}rojo{% elif m.tags == 'warning' %}ambar{% else %}verde{% endif %}" role="status">
  {% if m.tags == 'error' or m.tags == 'warning' %}
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9L2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
  {% else %}
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
  {% endif %}
  <span>{{ m }}</span>
</div>
{% endfor %}
